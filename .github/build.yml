name: Build Android Debug APK (ARM64)

on:
  push:
    branches: [ "main", "master" ] # Jalankan otomatis saat push ke branch ini
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan Anda menjalankan build manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    # Langkah Optimasi: Hanya compile arsitektur arm64-v8a untuk mempercepat build
    - name: Build Debug APK (ARM64 Only)
      run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gassist-debug-arm64
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7 # APK akan tersimpan di GitHub selama 7 hari
        
